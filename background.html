<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>slop computer // background</title>
<style>
  html, body { margin:0; padding:0; background:#000; overflow:hidden; height:100%; }
  #stage { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:#000; }
  #wrap { position:relative; aspect-ratio:16/9; width:100vw; max-height:100vh; }
  @media (min-aspect-ratio:16/9){ #wrap{ width:auto; height:100vh; } }
  canvas { display:block; width:100%; height:100%; }
  #scan { position:absolute; inset:0; pointer-events:none;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,0.22) 0px, rgba(0,0,0,0.22) 1px, transparent 1px, transparent 3px);
    mix-blend-mode:multiply; }
  #vig { position:absolute; inset:0; pointer-events:none;
    background:
      linear-gradient(90deg, rgba(0,0,0,0.5) 0%, transparent 12%, transparent 88%, rgba(0,0,0,0.5) 100%),
      linear-gradient(0deg, rgba(0,0,0,0.5) 0%, transparent 14%, transparent 86%, rgba(0,0,0,0.5) 100%); }
</style>
</head>
<body>
  <div id="stage"><div id="wrap">
    <canvas id="c"></canvas>
    <div id="scan"></div>
    <div id="vig"></div>
  </div></div>
<script type="module">
import { drawEth, drawClaw, drawComputer, loadComputer } from './slop-shapes.js';
loadComputer('computer.png');
// unique window title for the OBS patcher (e.g. ?t=SLOPTUBE-BG) so it never
// grabs a stray window that happens to share the default title.
{ const _t = new URLSearchParams(location.search).get('t'); if (_t) document.title = _t; }

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const gcanvas = document.createElement('canvas');
const gtx = gcanvas.getContext('2d');

let W=0, H=0, DPR=1;
function resize(){
  const r = canvas.getBoundingClientRect();
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.max(2, Math.floor(r.width)); H = Math.max(2, Math.floor(r.height));
  canvas.width = Math.floor(W*DPR); canvas.height = Math.floor(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  gcanvas.width = canvas.width; gcanvas.height = canvas.height;
  gtx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize', resize);

/* ---- tunnel ---- */
const HALF_W=1.0, HALF_H=0.62, FOCAL=1.0, RING_SPACING=0.62, NUM_RINGS=46;
const NEAR=0.42, FAR=NUM_RINGS*RING_SPACING, LONGITUDINAL=8, SPEED=2.0, BEND=0.62, VP_Y=0.35;
const pathX = d => BEND*(1.15*Math.sin(d*0.105+1.3)+0.55*Math.sin(d*0.043+0.2));
const pathY = d => BEND*(0.70*Math.sin(d*0.082+0.6)+0.35*Math.cos(d*0.037+2.1));
const PERIM=[];
for (let i=0;i<=LONGITUDINAL;i++){ const tx=-HALF_W+2*HALF_W*(i/LONGITUDINAL); const edge=(i===0||i===LONGITUDINAL);
  PERIM.push({x:tx,y:-HALF_H,corner:edge}); PERIM.push({x:tx,y:HALF_H,corner:edge}); }
for (let i=1;i<LONGITUDINAL;i++){ const ty=-HALF_H+2*HALF_H*(i/LONGITUDINAL);
  PERIM.push({x:-HALF_W,y:ty,corner:false}); PERIM.push({x:HALF_W,y:ty,corner:false}); }
const CORNER_LOCAL=[{x:-HALF_W,y:-HALF_H},{x:HALF_W,y:-HALF_H},{x:HALF_W,y:HALF_H},{x:-HALF_W,y:HALF_H}];
function proj(px,py,d,z,camX,camY){ const s=(FOCAL/z)*(H*0.9);
  return { x:W*0.5+(px+pathX(d)-camX)*s, y:H*VP_Y+(py+pathY(d)-camY)*s }; }
const fog = z => Math.pow(Math.max(0,Math.min(1,(FAR-z)/FAR)),1.6);
function strokeRing(g,c){ g.beginPath(); g.moveTo(c[0].x,c[0].y); g.lineTo(c[1].x,c[1].y);
  g.lineTo(c[2].x,c[2].y); g.lineTo(c[3].x,c[3].y); g.closePath(); g.stroke(); }
let travel=0, phase=0, last=0;
function drawTunnel(dt){
  travel -= SPEED*dt; phase += dt;
  ctx.fillStyle='#06030d'; ctx.fillRect(0,0,W,H);
  const pulse=0.85+0.15*Math.sin(phase*2.0);
  const camX=pathX(travel), camY=pathY(travel);
  const kStart=Math.ceil((travel+NEAR)/RING_SPACING);
  const rings=[];
  for (let n=0;n<NUM_RINGS;n++){ const k=kStart+n; const d=k*RING_SPACING; const z=d-travel;
    if (z<NEAR||z>FAR) continue; const f=fog(z); if (f<=0.001) continue;
    rings.push({z,f,k, corners:CORNER_LOCAL.map(c=>proj(c.x,c.y,d,z,camX,camY)),
                perim:PERIM.map(p=>proj(p.x,p.y,d,z,camX,camY))}); }
  gtx.setTransform(DPR,0,0,DPR,0,0); gtx.clearRect(0,0,W,H);
  gtx.lineCap='round'; gtx.lineJoin='round';
  for (let j=0;j<PERIM.length;j++){ if (rings.length<2) break;
    const isC=PERIM[j].corner; const a=rings[0].perim[j], b=rings[rings.length-1].perim[j];
    const grad=gtx.createLinearGradient(a.x,a.y,b.x,b.y);
    grad.addColorStop(0,`rgba(255,${isC?120:90},220,${(isC?1.0:0.8)*pulse})`);
    grad.addColorStop(0.55,`rgba(220,90,240,${(isC?0.8:0.55)*pulse})`);
    grad.addColorStop(1,`rgba(150,90,255,${0.14*pulse})`);
    gtx.strokeStyle=grad; gtx.lineWidth=isC?2.2:1.4;
    gtx.beginPath(); gtx.moveTo(rings[0].perim[j].x,rings[0].perim[j].y);
    for (let r=1;r<rings.length;r++) gtx.lineTo(rings[r].perim[j].x,rings[r].perim[j].y);
    gtx.stroke(); }
  for (let r=rings.length-1;r>=0;r--){ const ring=rings[r]; const f=ring.f; const alpha=f*pulse;
    const accent=(ring.k%6===0);
    gtx.strokeStyle=accent?`rgba(63,207,255,${0.95*alpha})`:`rgba(255,${Math.round(62+60*f)},201,${0.98*alpha})`;
    gtx.lineWidth=1.7*(0.6+f); strokeRing(gtx,ring.corners); }
  ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.globalCompositeOperation='lighter';
  ctx.filter=`blur(${Math.max(2,Math.round(4.5*DPR))}px)`; ctx.globalAlpha=0.9; ctx.drawImage(gcanvas,0,0);
  ctx.filter='none'; ctx.globalAlpha=1; ctx.drawImage(gcanvas,0,0); ctx.restore();
}

/* ---- objects handed off from the foreground, receding down the tube ---- */
const items = [];   // {kind,x,y,t0,scale0,spin0,angle,open}
const Z0=1.0, RECEDE=1.6;
function spawnFromMessage(m){
  if (!m || !m.kind) return;
  items.push({
    kind: m.kind,
    x: m.x * W, y: m.y * H,                 // normalized -> px
    scale0: m.s * H,
    spin0: m.spin || 0, angle: m.angle || 0, open: m.open || 0,
    t0: performance.now(),
  });
}
// receive handoffs from the foreground via the relay (works across Chrome instances)
const es = new EventSource('/events');
es.onmessage = (e) => { try { spawnFromMessage(JSON.parse(e.data)); } catch(_){} };

function drawItems(now){
  const VPx=W*0.5, VPy=H*VP_Y;
  for (let i=items.length-1;i>=0;i--){
    const L=items[i]; const age=(now-L.t0)/1000;
    const z=Z0+RECEDE*age; const k=1-Z0/z;
    if (k>0.5){ items.splice(i,1); continue; }
    const px=L.x+(VPx-L.x)*k, py=L.y+(VPy-L.y)*k;
    const s=L.scale0*(Z0/z);
    let alpha=1; if (k>0.22) alpha=Math.max(0,1-(k-0.22)/0.28);
    if (L.kind==='eth')       drawEth(ctx, px,py, s, L.spin0+age*0.9, alpha);
    else if (L.kind==='claw') drawClaw(ctx, px,py, s, L.angle, L.open, alpha);
    else if (L.kind==='computer') drawComputer(ctx, px,py, s, alpha);
  }
}

function loop(now){
  if (!last) last=now;
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  drawTunnel(dt);
  drawItems(now);
  requestAnimationFrame(loop);
}
resize();
requestAnimationFrame(loop);
</script>
</body>
</html>
