<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>slop computer // foreground</title>
<style>
  html, body { margin:0; padding:0; background:#000; overflow:hidden; height:100%; }
  #stage { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:#000; }
  #wrap { position:relative; aspect-ratio:16/9; width:100vw; max-height:100vh; }
  @media (min-aspect-ratio:16/9){ #wrap{ width:auto; height:100vh; } }
  canvas { display:block; width:100%; height:100%; }
</style>
</head>
<body>
  <div id="stage"><div id="wrap"><canvas id="c"></canvas></div></div>
<script type="module">
import { drawEth, drawClaw, drawComputer, loadComputer } from './slop-shapes.js';
loadComputer('computer.png');
{ const _t = new URLSearchParams(location.search).get('t'); if (_t) document.title = _t; }

// Black background for the OBS LUMA KEY. Set null for transparent.
const FG_BG = '#000000';
const MIRROR = false;        // flip if the rendered objects land on the wrong side vs your composite
const VP_Y = 0.35;           // must match background's vanishing point
const CLAW_INWARD = 40 * Math.PI / 180;  // rotate each claw this much toward screen-center
// thin geometric cockpit-hull border (in PIXELS): a narrow band around the edge,
// flood-filled with rungs + diagonal hatch + concentric rails. Overlays you (fg in front).
const FRAME = true;
const FRAME_MARGIN = 0;    // px from screen edge (0 = bleed to the very edge)
const FRAME_BAND   = 15;   // px band thickness (edge -> opening)
const FRAME_HATCH  = 6;    // px between geometric lines (smaller = denser)

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const fcanvas = document.createElement('canvas');   // cached static cockpit frame
const fctx = fcanvas.getContext('2d');
let W=0, H=0, DPR=1;
function resize(){
  const r = canvas.getBoundingClientRect();
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.max(2, Math.floor(r.width)); H = Math.max(2, Math.floor(r.height));
  canvas.width = Math.floor(W*DPR); canvas.height = Math.floor(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(FRAME){ fcanvas.width=canvas.width; fcanvas.height=canvas.height;
    fctx.setTransform(DPR,0,0,DPR,0,0); fctx.clearRect(0,0,W,H); drawFrame(fctx); }
  idlePainted=false;
}
window.addEventListener('resize', resize);

// hand off a released object to the background screen (normalized coords)
function send(kind, x, y, scale, extra={}){
  const body = JSON.stringify({ kind, x:x/W, y:y/H, s:scale/H, ...extra });
  fetch('/spawn', { method:'POST', body, keepalive:true }).catch(()=>{});
}

// ---- hand input: from the native detector via SSE (no webcam here) ----
let latestHands = [], lastHandsAt = 0;
const es = new EventSource('/hands.sse');
es.onmessage = e => {
  try {
    const d = JSON.parse(e.data);
    latestHands = (d.hands || []).map(h => ({
      chirality: h.chirality,
      lm: (h.lm || []).map(p => ({ x: MIRROR ? 1 - p[0] : p[0], y: p[1] }))
    }));
    lastHandsAt = performance.now();
  } catch(_) {}
};

function dist2(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }
function palmCenter(lm){ const idx=[0,5,9,13,17]; let x=0,y=0;
  for(const i of idx){ x+=lm[i].x; y+=lm[i].y; } return {x:x/idx.length, y:y/idx.length}; }
function handPose(lm){
  const w=lm[0], ext=[];
  ext[0] = dist2(lm[4],w) > dist2(lm[2],w)*1.0;
  const pr=[[8,6],[12,10],[16,14],[20,18]];
  for(let i=0;i<4;i++) ext[i+1] = dist2(lm[pr[i][0]],w) > dist2(lm[pr[i][1]],w)*0.9;
  const count=ext.filter(Boolean).length;
  return { count, fistish:count<=1, open:count>=4 };
}

// thin geometric border: 3 concentric rails + dense perpendicular rungs + diagonal hatch
function drawFrame(g){
  const m=FRAME_MARGIN, b=FRAME_BAND, h=FRAME_HATCH;
  const oL=m, oT=m, oR=W-m, oB=H-m;            // outer rail (hull)
  const iL=m+b, iT=m+b, iR=W-m-b, iB=H-m-b;    // inner rail (opening)
  g.save();
  g.shadowColor='#ff3ec9'; g.shadowBlur=4; g.lineCap='butt'; g.lineJoin='miter';

  // diagonal hatch filling the band (parallel struts) — drawn first, dim
  g.strokeStyle='rgba(255,62,201,0.30)'; g.lineWidth=1;
  g.beginPath();
  for(let x=oL-b; x<=oR; x+=h){
    g.moveTo(x,oT);  g.lineTo(x+b,iT);     // top
    g.moveTo(x,iB);  g.lineTo(x+b,oB);     // bottom
  }
  for(let y=oT-b; y<=oB; y+=h){
    g.moveTo(oL,y);  g.lineTo(iL,y+b);     // left
    g.moveTo(iR,y);  g.lineTo(oR,y+b);     // right
  }
  g.stroke();

  // dense perpendicular rungs across the band (cyan)
  g.strokeStyle='rgba(63,207,255,0.55)'; g.lineWidth=1;
  g.beginPath();
  for(let x=oL; x<=oR; x+=h){ g.moveTo(x,oT); g.lineTo(x,iT); g.moveTo(x,iB); g.lineTo(x,oB); }
  for(let y=oT; y<=oB; y+=h){ g.moveTo(oL,y); g.lineTo(iL,y); g.moveTo(iR,y); g.lineTo(oR,y); }
  g.stroke();

  // 3 concentric rails (outer / mid / inner) — bold magenta
  g.strokeStyle='rgba(255,62,201,0.95)'; g.lineWidth=1.6;
  g.strokeRect(oL,oT,oR-oL,oB-oT);
  g.strokeRect(iL,iT,iR-iL,iB-iT);
  g.strokeStyle='rgba(255,62,201,0.5)'; g.lineWidth=1;
  const md=Math.round(b/2);
  g.strokeRect(oL+md,oT+md,(oR-oL)-2*md,(oB-oT)-2*md);

  // ── cockpit hull modules (viewed from outside): panels, vents, lights, consoles ──
  const M='rgba(255,62,201,', C='rgba(63,207,255,';
  // panel: outlined box with internal hatch (vert or horiz)
  const panel=(x,y,w,hh,vert=true)=>{
    g.strokeStyle=M+'0.9)'; g.lineWidth=1.5; g.strokeRect(x,y,w,hh);
    g.strokeStyle=C+'0.4)'; g.lineWidth=1; g.beginPath();
    if(vert){ for(let xx=x+5; xx<x+w-1; xx+=6){ g.moveTo(xx,y+2); g.lineTo(xx,y+hh-2); } }
    else    { for(let yy=y+5; yy<y+hh-1; yy+=6){ g.moveTo(x+2,yy); g.lineTo(x+w-2,yy); } }
    g.stroke();
  };
  // vent: tight parallel slats
  const vent=(x,y,w,hh,vert=true)=>{
    g.strokeStyle=M+'0.6)'; g.lineWidth=1.5; g.beginPath();
    if(vert){ for(let yy=y+2; yy<y+hh; yy+=4){ g.moveTo(x,yy); g.lineTo(x+w,yy); } }
    else    { for(let xx=x+2; xx<x+w; xx+=4){ g.moveTo(xx,y); g.lineTo(xx,y+hh); } }
    g.stroke();
  };
  const buttons=(x,y,w,hh)=>{
    const sq=Math.min(hh-4,8), gap=sq+5; g.strokeStyle='rgba(188,255,91,0.75)'; g.lineWidth=1;
    g.beginPath(); for(let bx=x+4; bx+sq<=x+w-2; bx+=gap){ g.rect(bx, y+(hh-sq)/2, sq, sq); } g.stroke();
  };
  // row of indicator lights (filled dots)
  const lights=(x,y,n,gap,col,horiz=true)=>{ g.fillStyle=col;
    for(let i=0;i<n;i++){ g.beginPath(); g.arc(horiz?x+i*gap:x, horiz?y:y+i*gap, 2.2, 0, 7); g.fill(); } };
  // angled corner console (triangle wedge with a hatch line)
  const wedge=(ax,ay,bx,by,px,py)=>{ g.strokeStyle=M+'0.9)'; g.lineWidth=1.5;
    g.beginPath(); g.moveTo(ax,ay); g.lineTo(px,py); g.lineTo(bx,by); g.stroke();
    g.strokeStyle=C+'0.4)'; g.lineWidth=1; g.beginPath();
    g.moveTo((ax+px)/2,(ay+py)/2); g.lineTo((bx+px)/2,(by+py)/2); g.stroke(); };

  // corner consoles (cut + brace the four corners)
  const cc=52;
  wedge(iL,iT+cc, iL+cc,iT, iL,iT);   // TL
  wedge(iR-cc,iT, iR,iT+cc, iR,iT);   // TR
  wedge(iR,iB-cc, iR-cc,iB, iR,iB);   // BR
  wedge(iL+cc,iB, iL,iB-cc, iL,iB);   // BL

  // TOP edge cluster
  panel(W*0.50-140, iT, 280, 16);                 // center HUD
  lights(W*0.50-60, iT+24, 6, 16, 'rgba(188,255,91,0.8)');
  vent(W*0.30, iT, 86, 13, true);                 // intake vent
  panel(iL+90, iT, 66, 11);
  panel(W*0.64, iT, 130, 20); buttons(W*0.64+6, iT+4, 118, 12);
  lights(W*0.24, iT+8, 3, 12, 'rgba(255,174,0,0.85)');

  // LEFT edge stack (asymmetric)
  panel(iL, H*0.16, 26, 64);
  vent(iL, H*0.30, 22, 58, true);
  panel(iL, H*0.42, 32, 150, false);  buttons(iL+5, H*0.42+6, 22, 138>30?30:138);
  lights(iL+12, H*0.70, 4, 12, 'rgba(63,207,255,0.85)', false);
  panel(iL, H*0.78, 24, 80);

  // RIGHT edge stack (different from left)
  panel(iR-30, H*0.20, 30, 104);
  vent(iR-22, H*0.40, 22, 66, true);
  panel(iR-28, H*0.56, 28, 132, false);
  lights(iR-13, H*0.80, 3, 13, 'rgba(255,174,0,0.85)', false);

  // BOTTOM console row (heavier — the dashboard you sit behind)
  const cw=Math.round(W*0.32), cx=Math.round(W*0.5-cw/2);
  panel(cx, iB-40, cw, 40); buttons(cx+10, iB-36, cw-20, 14);
  lights(cx+14, iB-12, Math.floor((cw-28)/16), 16, 'rgba(63,207,255,0.85)');
  panel(W*0.12, iB-26, 150, 26); vent(W*0.12+6, iB-22, 138, 18, false);
  panel(W*0.70, iB-30, 190, 30); buttons(W*0.70+8, iB-26, 174, 22);

  g.shadowBlur=0; g.restore();
}

const heldEth = {};      // key -> {x,y,scale,spin}
const heldClaw = {};     // key -> {x,y,scale,angle,open}
const lastEmit = {};
const EMIT_INTERVAL = 150;
let compActive=false, lastComp=null, frameHoldUntil=0, dbg=0;
window.addEventListener('keydown', e=>{ if(e.key==='c')dbg=dbg===1?0:1; if(e.key==='x')dbg=dbg===2?0:2; });

// cap redraw to ~30fps to match OBS output (was running at full display refresh)
const FPS=30, FRAME_MS=1000/FPS;
let last=0, idlePainted=false, lastDraw=0;
function loop(now){
  requestAnimationFrame(loop);
  if(now-lastDraw < FRAME_MS-1) return;   // throttle to FPS

  if(!last) last=now;
  const dt=Math.min(0.05,(now-last)/1000); last=now;

  // stale guard: if the detector stopped sending, treat as no hands
  const hs = (performance.now()-lastHandsAt < 700) ? latestHands : [];

  // idle skip: nothing held, no hands, no computer -> canvas already shows
  // the black + static frame, so don't burn cycles repainting the same pixels
  const idle = hs.length===0 && !compActive && now>=frameHoldUntil && !dbg
    && Object.keys(heldEth).length===0 && Object.keys(heldClaw).length===0;
  if(idle && idlePainted){ return; }
  lastDraw=now;

  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(FG_BG){ ctx.fillStyle=FG_BG; ctx.fillRect(0,0,W,H); } else ctx.clearRect(0,0,W,H);
  if(FRAME){ ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.drawImage(fcanvas,0,0); ctx.restore(); }
  idlePainted = idle;

  const hands=[];
  hs.forEach((h,idx)=>{
    const lm=h.lm; if(!lm || lm.length<21) return;
    const c=palmCenter(lm);
    const sx=c.x*W, sy=c.y*H;
    const dx=(lm[9].x-lm[0].x)*W, dy=(lm[9].y-lm[0].y)*H;
    const span=Math.hypot(dx,dy);
    hands.push({ key:(h.chirality||'h')+idx, lm, sx, sy, dx, dy, span, scale:Math.max(30,span*1.7), pose:handPose(lm) });
  });

  // two-hand frame -> hold the computer
  let frame=null;
  if(hands.length>=2){
    const a=hands[0], b=hands[1];
    const d=Math.hypot(a.sx-b.sx, a.sy-b.sy), avg=(a.span+b.span)/2;
    if(d < avg*4.5 && !a.pose.fistish && !b.pose.fistish){
      let minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9;
      for(const hi of [a,b]) for(const p of hi.lm){ const x=p.x*W,y=p.y*H;
        if(x<minx)minx=x; if(x>maxx)maxx=x; if(y<miny)miny=y; if(y>maxy)maxy=y; }
      frame={ cx:(minx+maxx)/2, cy:(miny+maxy)/2, size:Math.min(Math.max(maxx-minx,maxy-miny)*1.15, H*0.92) };
    }
  }
  if(frame){ frameHoldUntil=now+200; lastComp=frame; }

  const ethSeen={}, clawSeen={};
  if(now < frameHoldUntil && lastComp){
    compActive=true;
    drawComputer(ctx, lastComp.cx, lastComp.cy, lastComp.size, 1);
  } else {
    if(compActive){ send('computer', lastComp.cx, lastComp.cy, lastComp.size); compActive=false; }
    for(const hi of hands){
      const angle=Math.atan2(hi.dy,hi.dx);
      if(hi.pose.open){                                   // ✋ eth tracks the hand
        const prev=heldEth[hi.key];
        heldEth[hi.key]={ x:hi.sx, y:hi.sy, scale:hi.scale, spin:(prev?prev.spin:0)+dt*1.2 };
        ethSeen[hi.key]=1;
        drawEth(ctx, hi.sx, hi.sy, hi.scale, heldEth[hi.key].spin, 1);
      } else if(hi.pose.fistish){                          // ✊ drop + emit stream
        if(now-(lastEmit[hi.key]||0) >= EMIT_INTERVAL){
          lastEmit[hi.key]=now;
          const jx=(Math.random()-0.5)*18, jy=(Math.random()-0.5)*18;
          send('eth', hi.sx+jx, hi.sy+jy, hi.scale, { spin:Math.random()*6.28 });
        }
      } else {                                             // 🦞 claw, opens with pinch
        const pinchPx=Math.hypot((hi.lm[4].x-hi.lm[8].x)*W,(hi.lm[4].y-hi.lm[8].y)*H);
        const openAmt=Math.max(0,Math.min(1,(pinchPx/Math.max(1,hi.span)-0.35)/1.0))*0.5;
        const clawAngle = angle + (hi.sx < W/2 ? 1 : -1) * CLAW_INWARD;  // tilt inward
        heldClaw[hi.key]={ x:hi.sx, y:hi.sy, scale:hi.span*2.4, angle:clawAngle, open:openAmt };
        clawSeen[hi.key]=1;
        drawClaw(ctx, hi.sx, hi.sy, hi.span*2.4, clawAngle, openAmt, 1);
      }
    }
  }

  // release (hand off to background) anything whose hand-state ended this frame
  for(const key in heldEth){ if(!ethSeen[key]){ const h=heldEth[key];
    send('eth', h.x, h.y, h.scale, { spin:h.spin }); delete heldEth[key]; } }
  for(const key in heldClaw){ if(!clawSeen[key]){ const h=heldClaw[key];
    send('claw', h.x, h.y, h.scale, { angle:h.angle, open:h.open }); delete heldClaw[key]; } }

  if(dbg===1) drawComputer(ctx, W*0.5, H*0.5, H*0.55, 1);
  if(dbg===2) drawClaw(ctx, W*0.5, H*0.5, H*0.16, 0, 0.32, 1);
}
resize();
requestAnimationFrame(loop);
</script>
</body>
</html>
